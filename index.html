<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FIRST IMPACT FACE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; color:#fff; }

/* SPLASH */
#splash { position:fixed; inset:0; z-index:300; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 1s ease; }
#splash.hide { opacity:0; pointer-events:none; }
.sp-lab { font-size:9px; letter-spacing:6px; color:rgba(255,255,255,0.2); text-transform:uppercase; margin-bottom:28px; }
.sp-first { font-size:11px; letter-spacing:8px; color:rgba(255,255,255,0.35); text-transform:uppercase; }
.sp-impact { font-size:58px; font-weight:900; letter-spacing:-3px; line-height:1; color:#fff; }
.sp-face { font-size:11px; letter-spacing:8px; color:rgba(255,255,255,0.35); text-transform:uppercase; }
.sp-rule { width:1px; height:40px; background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.3),transparent); margin:20px 0; }
.sp-sub { font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.2); text-align:center; line-height:2; text-transform:uppercase; }
.sp-bar { width:120px; height:1px; background:rgba(255,255,255,0.08); margin-top:36px; position:relative; overflow:hidden; }
.sp-bar::after { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:#fff; animation:load 2s ease forwards 0.5s; }
@keyframes load { to { left:100%; } }

/* APP */
#app { position:fixed; inset:0; }
#video { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scaleX(-1); min-width:100%; min-height:100%; width:auto; height:auto; filter:brightness(1.04) contrast(0.92) saturate(1.1); }

/* SCAN GRID */
#scan-grid { position:absolute; inset:0; background:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size:40px 40px; opacity:0; transition:opacity 0.5s; pointer-events:none; }
#scan-grid.show { opacity:1; }

/* FACE FRAME */
#face-frame { position:absolute; top:50%; left:50%; transform:translate(-50%,-58%); width:200px; height:240px; pointer-events:none; opacity:0; transition:opacity 0.5s; }
#face-frame.show { opacity:1; }
.ff-corner { position:absolute; width:20px; height:20px; }
.ff-corner.tl { top:0; left:0; border-top:1.5px solid rgba(255,255,255,0.5); border-left:1.5px solid rgba(255,255,255,0.5); }
.ff-corner.tr { top:0; right:0; border-top:1.5px solid rgba(255,255,255,0.5); border-right:1.5px solid rgba(255,255,255,0.5); }
.ff-corner.bl { bottom:0; left:0; border-bottom:1.5px solid rgba(255,255,255,0.5); border-left:1.5px solid rgba(255,255,255,0.5); }
.ff-corner.br { bottom:0; right:0; border-bottom:1.5px solid rgba(255,255,255,0.5); border-right:1.5px solid rgba(255,255,255,0.5); }
.ff-scan-line { position:absolute; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent); animation:ffScan 2s linear infinite; }
@keyframes ffScan { 0%{top:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{top:100%;opacity:0} }

/* TOPBAR */
#topbar { position:fixed; top:0; left:0; right:0; padding:52px 20px 14px; background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent); display:flex; align-items:center; justify-content:space-between; z-index:10; }
#status-wrap { display:flex; align-items:center; gap:8px; }
#status-dot { width:5px; height:5px; border-radius:50%; background:#333; transition:all 0.3s; }
#status-dot.on { background:#4fffb0; box-shadow:0 0 8px #4fffb0; }
#status-text { font-size:8px; letter-spacing:2px; color:rgba(255,255,255,0.3); text-transform:uppercase; }
#app-name { font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase; }
#cam-toggle { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
#cam-toggle:active { background:rgba(255,255,255,0.2); transform:scale(0.92); }

/* STEP INDICATOR */
#step-indicator { position:fixed; top:110px; left:50%; transform:translateX(-50%); z-index:10; display:none; flex-direction:column; align-items:center; gap:10px; }
#step-indicator.show { display:flex; }
.step-dots { display:flex; gap:8px; align-items:center; }
.step-dot { width:28px; height:3px; border-radius:2px; background:rgba(255,255,255,0.15); transition:all 0.3s; }
.step-dot.active { background:#fff; }
.step-dot.done { background:rgba(255,255,255,0.4); }
.step-dot.smile { background:#4fffb0; }
#step-label { font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.4); text-transform:uppercase; }

/* BOTTOM SCAN */
#bottom-scan { position:fixed; bottom:0; left:0; right:0; padding:20px 20px 52px; background:linear-gradient(to top,rgba(0,0,0,0.95) 60%,transparent); z-index:10; }
.stb-num { font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.25); margin-bottom:4px; }
.stb-name { font-size:22px; font-weight:900; letter-spacing:2px; line-height:1; }
.stb-name.neutral { color:#fff; }
.stb-name.smile { color:#4fffb0; }
.scan-hint { font-size:10px; color:rgba(255,255,255,0.25); letter-spacing:1px; margin:8px 0 18px; line-height:1.7; }
#cap-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:17px; border-radius:14px; border:none; font-size:14px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all 0.2s; text-transform:uppercase; }
#cap-btn.neutral-mode { background:#fff; color:#000; }
#cap-btn.smile-mode { background:#4fffb0; color:#000; }
#cap-btn:disabled { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.2); cursor:not-allowed; }
#cap-btn:active:not(:disabled) { transform:scale(0.97); }
.cap-icon { width:16px; height:16px; border-radius:50%; border:2px solid currentColor; position:relative; flex-shrink:0; }
.cap-icon::after { content:''; position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background:currentColor; transform:translate(-50%,-50%); }

/* PREVIEW */
#preview-thumb { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:15; display:none; flex-direction:column; align-items:center; gap:16px; background:rgba(0,0,0,0.92); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:24px; backdrop-filter:blur(20px); }
#preview-thumb.show { display:flex; }
.pt-label { font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.4); }
.pt-img { width:130px; height:130px; border-radius:14px; object-fit:cover; transform:scaleX(-1); }
.pt-actions { display:flex; gap:10px; width:100%; }
.pt-ok { flex:1; padding:12px; border-radius:10px; border:none; background:#fff; color:#000; font-size:12px; font-weight:700; letter-spacing:2px; cursor:pointer; text-transform:uppercase; }
.pt-ok.smile-ok { background:#4fffb0; }
.pt-retry { flex:1; padding:12px; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.5); font-size:12px; cursor:pointer; letter-spacing:2px; text-transform:uppercase; }

/* ANALYZING */
#analyzing { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(16px); z-index:80; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
#analyzing.show { display:flex; }
.ana-photos { display:flex; gap:12px; margin-bottom:8px; }
.ana-photo { width:60px; height:60px; border-radius:10px; object-fit:cover; transform:scaleX(-1); border:1px solid rgba(255,255,255,0.1); }
.ana-label { font-size:8px; letter-spacing:2px; color:rgba(255,255,255,0.3); text-align:center; margin-top:4px; }
.ana-ring { width:40px; height:40px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.08); border-top-color:#fff; animation:spin 0.85s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.ana-text { font-size:10px; letter-spacing:4px; color:rgba(255,255,255,0.5); text-transform:uppercase; }
.ana-sub { font-size:8px; letter-spacing:2px; color:rgba(255,255,255,0.2); }

/* RESULT PANEL */
#result-panel { display:none; position:fixed; inset:0; background:#000; z-index:70; overflow-y:auto; padding:60px 20px 40px; }
#result-panel.show { display:block; }

.r-photos { display:flex; gap:12px; margin-bottom:20px; }
.r-photo-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
.r-photo { width:100%; aspect-ratio:1; border-radius:14px; object-fit:cover; transform:scaleX(-1); }
.r-photo-lbl { font-size:8px; letter-spacing:2px; color:rgba(255,255,255,0.3); text-transform:uppercase; }

/* 宝石タイプカード */
.gem-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px; margin-bottom:12px; text-align:center; }
.gem-emoji { font-size:40px; margin-bottom:8px; }
.gem-type-name { font-size:18px; font-weight:900; color:#fff; letter-spacing:1px; margin-bottom:4px; }
.gem-subtitle { font-size:10px; letter-spacing:3px; color:rgba(255,255,255,0.3); text-transform:uppercase; margin-bottom:12px; }
.gem-tagline { font-size:13px; color:rgba(255,255,255,0.6); line-height:1.7; font-style:italic; }

/* 印象カード */
.r-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:18px; margin-bottom:10px; }
.r-card-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.r-card-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.r-card-lbl { font-size:11px; letter-spacing:2px; color:#fff; font-weight:700; text-transform:uppercase; }
.r-card-text { font-size:14px; color:rgba(255,255,255,0.8); line-height:1.8; }
.r-shadow { font-size:12px; color:rgba(255,255,255,0.4); margin-top:8px; line-height:1.7; }
.r-potential { font-size:13px; color:#4fffb0; margin-top:10px; line-height:1.7; font-weight:500; }

/* パーツ評価 */
.parts-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:16px; margin-bottom:12px; }
.parts-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.parts-row:last-child { border-bottom:none; }
.parts-name { font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.4); text-transform:uppercase; }
.parts-val { font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px; }
.parts-val.good { background:rgba(79,255,176,0.1); color:#4fffb0; }
.parts-val.ok { background:rgba(250,204,21,0.1); color:#facc15; }
.parts-val.more { background:rgba(251,146,60,0.1); color:#fb923c; }

/* 目標タブセクション */
#goal-section { margin-bottom:12px; }
#goal-toggle { width:100%; padding:16px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:14px; color:rgba(255,255,255,0.6); font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:space-between; letter-spacing:1px; font-family:'Courier New',monospace; transition:all 0.2s; }
#goal-toggle:active { background:rgba(255,255,255,0.08); }
#goal-arrow { font-size:16px; transition:transform 0.3s; }
#goal-arrow.open { transform:rotate(180deg); }

#goal-tabs { display:none; margin-top:10px; }
#goal-tabs.show { display:block; }
.goal-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.goal-btn { padding:12px 8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:rgba(255,255,255,0.55); font-size:12px; cursor:pointer; text-align:center; transition:all 0.2s; font-family:'Courier New',monospace; line-height:1.4; }
.goal-btn:active { transform:scale(0.96); }
.goal-btn.selected { background:rgba(79,255,176,0.1); border-color:rgba(79,255,176,0.4); color:#4fffb0; }

/* 目標アドバイスカード */
#goal-advice-card { display:none; background:rgba(79,255,176,0.04); border:1px solid rgba(79,255,176,0.2); border-radius:16px; padding:18px; margin-bottom:12px; }
#goal-advice-card.show { display:block; }
.ga-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.ga-goal-name { font-size:12px; letter-spacing:2px; color:#4fffb0; font-weight:700; }
.ga-message { font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:14px; line-height:1.7; font-style:italic; }
.ga-points { display:flex; flex-direction:column; gap:10px; }
.ga-point { display:flex; gap:10px; align-items:flex-start; }
.ga-num { width:22px; height:22px; border-radius:50%; background:rgba(79,255,176,0.1); border:1px solid rgba(79,255,176,0.3); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#4fffb0; flex-shrink:0; margin-top:2px; }
.ga-text { font-size:13px; color:rgba(255,255,255,0.75); line-height:1.8; }

/* ゴールローディング */
#goal-loading { display:none; justify-content:center; padding:20px 0; }
#goal-loading.show { display:flex; }

#restart-btn { display:flex; align-items:center; justify-content:center; width:100%; margin-top:4px; padding:14px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:rgba(255,255,255,0.35); font-size:12px; cursor:pointer; letter-spacing:2px; text-transform:uppercase; font-family:'Courier New',monospace; }
</style>
</head>
<body>

<div id="splash">
  <div class="sp-lab">Expression Analysis System</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px;">
    <div class="sp-first">FIRST</div>
    <div class="sp-impact">IMPACT</div>
    <div class="sp-face">FACE</div>
  </div>
  <div class="sp-rule"></div>
  <div class="sp-sub">表情心理学 × 人相学 × 印象診断<br>AI EXPRESSION SCANNER</div>
  <div class="sp-bar"></div>
</div>

<div id="analyzing">
  <div class="ana-photos">
    <div><img id="ana-neutral" class="ana-photo" src="" alt=""><div class="ana-label">NEUTRAL</div></div>
    <div><img id="ana-smile" class="ana-photo" src="" alt=""><div class="ana-label">SMILE</div></div>
  </div>
  <div class="ana-ring"></div>
  <div class="ana-text">Analyzing</div>
  <div class="ana-sub">人相学 × 表情心理学 分析中</div>
</div>

<div id="app">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="cap" style="display:none;"></canvas>
  <div id="scan-grid"></div>
  <div id="face-frame">
    <div class="ff-corner tl"></div><div class="ff-corner tr"></div>
    <div class="ff-corner bl"></div><div class="ff-corner br"></div>
    <div class="ff-scan-line"></div>
  </div>

  <div id="topbar">
    <div id="status-wrap">
      <div id="status-dot"></div>
      <div id="status-text">Searching</div>
    </div>
    <div id="app-name">FIF</div>
    <button id="cam-toggle" onclick="toggleCamera()">⇄</button>
  </div>

  <div id="step-indicator">
    <div class="step-dots">
      <div class="step-dot" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>
    <div id="step-label">STEP 1 / 2</div>
  </div>

  <div id="bottom-scan">
    <div class="stb-num" id="step-num">STEP 01</div>
    <div class="stb-name neutral" id="step-name">NEUTRAL FACE</div>
    <div class="scan-hint" id="step-hint">力を抜いた自然な表情で<br>カメラを正面に向けてください</div>
    <button id="cap-btn" class="neutral-mode" disabled onclick="capture()">
      <div class="cap-icon"></div>
      <span id="cap-btn-label">SCAN NEUTRAL</span>
    </button>
  </div>
</div>

<div id="preview-thumb">
  <div class="pt-label" id="pt-label-text">NEUTRAL FACE</div>
  <img id="pt-img" class="pt-img" src="" alt="">
  <div class="pt-actions">
    <button class="pt-retry" onclick="retryCapture()">RETRY</button>
    <button class="pt-ok" id="pt-ok-btn" onclick="confirmCapture()">USE THIS</button>
  </div>
</div>

<div id="result-panel">
  <div class="r-photos">
    <div class="r-photo-wrap"><img id="r-neutral" class="r-photo" src="" alt=""><div class="r-photo-lbl">Neutral</div></div>
    <div class="r-photo-wrap"><img id="r-smile" class="r-photo" src="" alt=""><div class="r-photo-lbl">Smile</div></div>
  </div>

  <div class="gem-card">
    <div class="gem-emoji" id="r-gem-emoji">💎</div>
    <div class="gem-type-name" id="r-gem-name">—</div>
    <div class="gem-subtitle" id="r-gem-subtitle">—</div>
    <div class="gem-tagline" id="r-gem-tagline">—</div>
  </div>

  <div class="r-card">
    <div class="r-card-head"><div class="r-card-dot" style="background:#a78bfa;"></div><div class="r-card-lbl">今の印象</div></div>
    <div class="r-card-text" id="r-current"></div>
    <div class="r-shadow" id="r-shadow"></div>
    <div class="r-potential" id="r-potential"></div>
  </div>

  <div class="parts-card">
    <div class="parts-row">
      <div class="parts-name">目元</div>
      <div class="parts-val" id="p-eye">—</div>
    </div>
    <div class="parts-row">
      <div class="parts-name">眉間</div>
      <div class="parts-val" id="p-brow">—</div>
    </div>
    <div class="parts-row">
      <div class="parts-name">口元</div>
      <div class="parts-val" id="p-mouth">—</div>
    </div>
  </div>

  <div id="goal-section">
    <button id="goal-toggle" onclick="toggleGoalPanel()">
      どんな印象を目指しますか？
      <span id="goal-arrow">↓</span>
    </button>
    <div id="goal-tabs">
      <div class="goal-grid" id="goal-grid"></div>
    </div>
  </div>

  <div id="goal-loading">
    <div class="ana-ring"></div>
  </div>

  <div id="goal-advice-card">
    <div class="ga-head">
      <div class="r-card-dot" style="background:#4fffb0;"></div>
      <div class="ga-goal-name" id="ga-goal-name">—</div>
    </div>
    <div class="ga-message" id="ga-message"></div>
    <div class="ga-points">
      <div class="ga-point"><div class="ga-num">1</div><div class="ga-text" id="ga-p1"></div></div>
      <div class="ga-point"><div class="ga-num">2</div><div class="ga-text" id="ga-p2"></div></div>
      <div class="ga-point"><div class="ga-num">3</div><div class="ga-text" id="ga-p3"></div></div>
    </div>
  </div>

  <button id="restart-btn" onclick="restartAll()">← 最初からやり直す</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
// ── 宝石タイプデータ ──
const GEM_TYPES = {
  diamond:      { emoji:'💎', name:'ダイヤモンド型',    subtitle:'揺るがない存在感',     tagline:'どこにいても自然と中心になる人' },
  ruby:         { emoji:'🔴', name:'ルビー型',          subtitle:'情熱の温度',           tagline:'そばにいると元気をもらえる人' },
  sapphire:     { emoji:'💙', name:'サファイア型',      subtitle:'誠実な知性',           tagline:'信頼してまかせたくなる人' },
  emerald:      { emoji:'💚', name:'エメラルド型',      subtitle:'安心の包容力',         tagline:'一緒にいると心がほどける人' },
  amethyst:     { emoji:'💜', name:'アメジスト型',      subtitle:'静かな品格',           tagline:'言葉にしなくても伝わる人' },
  pearl:        { emoji:'🤍', name:'パール型',          subtitle:'清らかな女性らしさ',   tagline:'品があって、誰からも好かれる人' },
  pink_sapphire:{ emoji:'🌸', name:'ピンクサファイア型',subtitle:'愛されオーラ',         tagline:'自然と人が集まってくる人' },
  aquamarine:   { emoji:'🩵', name:'アクアマリン型',    subtitle:'透明感のさわやかさ',   tagline:'いるだけで場が明るくなる人' },
  opal:         { emoji:'🌈', name:'オパール型',        subtitle:'多彩な魅力',           tagline:'見るたびに新しい一面が見える人' },
  moonstone:    { emoji:'🌙', name:'ムーンストーン型',  subtitle:'繊細な感受性',         tagline:'人の気持ちに寄り添える人' },
  topaz:        { emoji:'🟡', name:'トパーズ型',        subtitle:'社交の太陽',           tagline:'誰とでもすぐ打ち解けられる人' },
  tanzanite:    { emoji:'🔵', name:'タンザナイト型',    subtitle:'高貴な冷静さ',         tagline:'凛とした佇まいで一目置かれる人' },
  garnet:       { emoji:'❤️', name:'ガーネット型',      subtitle:'努力が実る芯の強さ',   tagline:'コツコツ信頼を積み上げる人' },
  turquoise:    { emoji:'🩵', name:'ターコイズ型',      subtitle:'行動派のリーダー',     tagline:'前に進む勇気をくれる人' },
  citrine:      { emoji:'🟠', name:'シトリン型',        subtitle:'太陽のような明るさ',   tagline:'一緒にいると前向きになれる人' },
  rose_quartz:  { emoji:'🌹', name:'ローズクォーツ型',  subtitle:'慈愛の柔らかさ',       tagline:'包み込むような優しさを持つ人' },
  lapis:        { emoji:'💙', name:'ラピスラズリ型',    subtitle:'真実を映す誠実さ',     tagline:'裏表がなく信頼される人' },
  coral:        { emoji:'🪸', name:'コーラル型',        subtitle:'ぱっと華やぐ存在感',   tagline:'その場をぱっと明るくする人' },
  jade:         { emoji:'🟢', name:'翡翠型',            subtitle:'調和の徳',             tagline:'いるだけで場が整う人' },
  spinel:       { emoji:'⚫', name:'スピネル型',        subtitle:'凛とした芯',           tagline:'ぶれない強さを持つ人' },
  rutile:       { emoji:'✨', name:'ルチル型',          subtitle:'内に光を秘めた特別な個性', tagline:'他にはない魅力で記憶に残る人' }
};

const GOALS = [
  '親しみやすい印象','色気のある印象','上品な印象','頼りがいのある印象',
  '癒し系の印象','仕事できそうな印象','優しそうな印象','知的な印象',
  '明るい印象','余裕のある印象'
];

// ── 状態 ──
let step = 1;
let faceDetected = false;
let neutral1B64 = null;
let smile1B64   = null;
let pendingB64  = null;
let currentGender = 'womens';
let selectedGoal = null;

const STEP_CONFIG = {
  1: { num:'STEP 01', name:'NEUTRAL FACE', nameClass:'neutral', hint:'力を抜いた自然な表情で\nカメラを正面に向けてください', btnClass:'neutral-mode', btnLabel:'SCAN NEUTRAL', ptLabel:'NEUTRAL FACE', ptOkClass:'' },
  2: { num:'STEP 02', name:'NATURAL SMILE', nameClass:'smile', hint:'いつもの自然な笑顔を作って\nカメラを正面に向けてください', btnClass:'smile-mode', btnLabel:'SCAN SMILE', ptLabel:'NATURAL SMILE', ptOkClass:'smile-ok' }
};

function applyStep(s) {
  const c = STEP_CONFIG[s];
  document.getElementById('step-num').textContent  = c.num;
  document.getElementById('step-name').textContent = c.name;
  document.getElementById('step-name').className   = 'stb-name ' + c.nameClass;
  document.getElementById('step-hint').innerHTML   = c.hint.replace('\n','<br>');
  const btn = document.getElementById('cap-btn');
  btn.className = c.btnClass;
  btn.disabled  = !faceDetected;
  document.getElementById('cap-btn-label').textContent = c.btnLabel;
  ['dot1','dot2'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.className = 'step-dot';
    if (i + 1 < s)  el.classList.add('done');
    if (i + 1 === s) el.classList.add(s === 2 ? 'smile' : 'active');
  });
  document.getElementById('step-label').textContent = `STEP ${s} / 2`;
}

// ── キャプチャ ──
function capture() {
  const video = document.getElementById('video');
  const cap   = document.getElementById('cap');
  cap.width = video.videoWidth; cap.height = video.videoHeight;
  const ctx = cap.getContext('2d');
  ctx.save(); ctx.scale(-1,1); ctx.drawImage(video,-cap.width,0); ctx.restore();
  pendingB64 = cap.toDataURL('image/jpeg',0.85);
  const c = STEP_CONFIG[step];
  document.getElementById('pt-img').src = pendingB64;
  document.getElementById('pt-label-text').textContent = c.ptLabel;
  const okBtn = document.getElementById('pt-ok-btn');
  okBtn.className = 'pt-ok ' + c.ptOkClass;
  document.getElementById('preview-thumb').classList.add('show');
}

function retryCapture() {
  pendingB64 = null;
  document.getElementById('preview-thumb').classList.remove('show');
}

function confirmCapture() {
  document.getElementById('preview-thumb').classList.remove('show');
  if (step === 1) { neutral1B64 = pendingB64; step = 2; applyStep(2); }
  else if (step === 2) { smile1B64 = pendingB64; runAnalysis(); }
  pendingB64 = null;
}

// ── AI分析（スキャン） ──
async function runAnalysis() {
  document.getElementById('bottom-scan').style.display = 'none';
  document.getElementById('step-indicator').classList.remove('show');
  document.getElementById('scan-grid').classList.remove('show');
  document.getElementById('face-frame').classList.remove('show');
  document.getElementById('ana-neutral').src = neutral1B64;
  document.getElementById('ana-smile').src   = smile1B64;
  document.getElementById('analyzing').classList.add('show');

  try {
    const res = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        neutralB64: neutral1B64.split(',')[1],
        smileB64:   smile1B64.split(',')[1],
        gender: currentGender === 'mens' ? '男性' : '女性',
        round: 'scan'
      })
    });
    const result = await res.json();
    document.getElementById('analyzing').classList.remove('show');
    showResult(result);
  } catch(e) {
    document.getElementById('analyzing').classList.remove('show');
    alert('診断に失敗しました。再度お試しください。');
    restartAll();
    console.error(e);
  }
}

// ── 結果表示 ──
function showResult(r) {
  const gem = GEM_TYPES[r.gem_key] || GEM_TYPES['pearl'];
  document.getElementById('r-neutral').src = neutral1B64;
  document.getElementById('r-smile').src   = smile1B64;
  document.getElementById('r-gem-emoji').textContent    = gem.emoji;
  document.getElementById('r-gem-name').textContent     = gem.name;
  document.getElementById('r-gem-subtitle').textContent = gem.subtitle;
  document.getElementById('r-gem-tagline').textContent  = `「${gem.tagline}」`;
  document.getElementById('r-current').textContent  = r.current   || '';
  document.getElementById('r-shadow').textContent   = r.shadow ? `でも… ${r.shadow}` : '';
  document.getElementById('r-potential').textContent = r.potential ? `✨ ${r.potential}` : '';
  setPartVal('p-eye',   r.eye);
  setPartVal('p-brow',  r.brow);
  setPartVal('p-mouth', r.mouth);
  renderGoalGrid();
  document.getElementById('result-panel').classList.add('show');
}

function setPartVal(id, val) {
  const el = document.getElementById(id);
  el.textContent = val || '—';
  el.className = 'parts-val';
  if (val === '良好')    el.classList.add('good');
  else if (val === 'いい感じ') el.classList.add('ok');
  else if (val === 'もう少し') el.classList.add('more');
}

// ── 目標タブ ──
function renderGoalGrid() {
  const grid = document.getElementById('goal-grid');
  grid.innerHTML = '';
  GOALS.forEach(goal => {
    const btn = document.createElement('button');
    btn.className = 'goal-btn';
    btn.textContent = goal;
    btn.onclick = () => selectGoal(goal, btn);
    grid.appendChild(btn);
  });
}

function toggleGoalPanel() {
  const tabs  = document.getElementById('goal-tabs');
  const arrow = document.getElementById('goal-arrow');
  tabs.classList.toggle('show');
  arrow.classList.toggle('open');
}

async function selectGoal(goal, btn) {
  selectedGoal = goal;
  document.querySelectorAll('.goal-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('goal-tabs').classList.remove('show');
  document.getElementById('goal-arrow').classList.remove('open');
  document.getElementById('goal-advice-card').classList.remove('show');
  document.getElementById('goal-loading').classList.add('show');

  try {
    const res = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        neutralB64: neutral1B64.split(',')[1],
        smileB64:   smile1B64.split(',')[1],
        gender: currentGender === 'mens' ? '男性' : '女性',
        round: 'goal',
        goal
      })
    });
    const result = await res.json();
    document.getElementById('goal-loading').classList.remove('show');
    showGoalAdvice(goal, result);
  } catch(e) {
    document.getElementById('goal-loading').classList.remove('show');
    console.error(e);
  }
}

function showGoalAdvice(goal, r) {
  document.getElementById('ga-goal-name').textContent = goal;
  document.getElementById('ga-message').textContent   = r.goal_message || '';
  document.getElementById('ga-p1').textContent = r.point1 || '';
  document.getElementById('ga-p2').textContent = r.point2 || '';
  document.getElementById('ga-p3').textContent = r.point3 || '';
  document.getElementById('goal-advice-card').classList.add('show');
  document.getElementById('goal-advice-card').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ── リスタート ──
function restartAll() {
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('goal-advice-card').classList.remove('show');
  document.getElementById('goal-tabs').classList.remove('show');
  document.getElementById('goal-arrow').classList.remove('open');
  neutral1B64 = null; smile1B64 = null; selectedGoal = null;
  step = 1;
  applyStep(1);
  document.getElementById('bottom-scan').style.display = 'block';
  document.getElementById('step-indicator').classList.add('show');
  document.getElementById('scan-grid').classList.add('show');
  document.getElementById('face-frame').classList.add('show');
}

// ── カメラ ──
let facingMode    = 'user';
let currentStream = null;
let frameLoop     = null;
let faceMesh      = null;

async function launchStream() {
  const video = document.getElementById('video');
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  if (frameLoop) { clearInterval(frameLoop); frameLoop = null; }
  const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, width:{ ideal:1280 }, height:{ ideal:720 } } });
  currentStream = stream;
  video.srcObject = stream;
  video.style.transform = facingMode === 'user' ? 'translate(-50%,-50%) scaleX(-1)' : 'translate(-50%,-50%) scaleX(1)';
  await new Promise(r => { video.onloadedmetadata = r; });
  await video.play();
  frameLoop = setInterval(async () => { if (faceMesh && video.readyState >= 2) await faceMesh.send({ image: video }); }, 66);
}

async function startCamera() {
  try {
    await launchStream();
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
      document.getElementById('step-indicator').classList.add('show');
      document.getElementById('scan-grid').classList.add('show');
      document.getElementById('face-frame').classList.add('show');
      applyStep(1);
    }, 2400);
  } catch(e) {
    document.querySelector('.sp-sub').innerHTML = 'カメラの許可が必要です<br>設定から許可してください';
    document.querySelector('.sp-bar').style.display = 'none';
  }
}

async function toggleCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  document.getElementById('cam-toggle').style.color = facingMode === 'environment' ? '#4fffb0' : '#fff';
  faceDetected = false;
  document.getElementById('cap-btn').disabled = true;
  try { await launchStream(); } catch(e) { console.error(e); }
}

async function initFaceMesh() {
  faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
  faceMesh.onResults(results => {
    const detected = results.multiFaceLandmarks?.length > 0;
    if (detected !== faceDetected) {
      faceDetected = detected;
      const dot = document.getElementById('status-dot');
      const txt = document.getElementById('status-text');
      const btn = document.getElementById('cap-btn');
      if (detected) {
        dot.classList.add('on'); txt.textContent = 'Face Detected';
        if (!document.getElementById('preview-thumb').classList.contains('show') &&
            !document.getElementById('analyzing').classList.contains('show') &&
            !document.getElementById('result-panel').classList.contains('show')) btn.disabled = false;
      } else {
        dot.classList.remove('on'); txt.textContent = 'Searching';
        btn.disabled = true;
      }
    }
  });
}

window.addEventListener('load', async () => {
  await initFaceMesh();
  await startCamera();
});
</script>
